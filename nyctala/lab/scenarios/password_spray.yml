name: password_spray
description: One address tries a common password against many account names.
expect:
  - ssh_password_spray
  - ssh_bruteforce
events:
  - {at: 0, dataset: auth_log, line: "{syslog} vps-a sshd[2001]: Failed password for invalid user admin from 192.0.2.50 port 41000 ssh2"}
  - {at: 2, dataset: auth_log, line: "{syslog} vps-a sshd[2002]: Failed password for invalid user oracle from 192.0.2.50 port 41002 ssh2"}
  - {at: 4, dataset: auth_log, line: "{syslog} vps-a sshd[2003]: Failed password for invalid user test from 192.0.2.50 port 41004 ssh2"}
  - {at: 6, dataset: auth_log, line: "{syslog} vps-a sshd[2004]: Failed password for ubuntu from 192.0.2.50 port 41006 ssh2"}
  - {at: 8, dataset: auth_log, line: "{syslog} vps-a sshd[2005]: Failed password for invalid user postgres from 192.0.2.50 port 41008 ssh2"}
