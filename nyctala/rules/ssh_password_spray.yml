title: SSH password spraying
name: ssh_password_spray
id: ce4d367b-7c2f-4e5c-9051-d261c2097924
status: test
description: Failed SSH logins for five or more distinct users from one source address within ten minutes.
author: sabitova
date: 2026-10-22
tags:
  - attack.credential-access
  - attack.t1110.003
correlation:
  type: value_count
  rules:
    - ssh_failed_login
  group-by:
    - source.ip
  timespan: 10m
  condition:
    field: user.name
    gte: 5
falsepositives:
  - A shared jump host where several users mistype their password
level: medium
