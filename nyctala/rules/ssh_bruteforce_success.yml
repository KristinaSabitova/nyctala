title: SSH brute force followed by a successful login
name: ssh_bruteforce_success
id: d9f9ef7b-4a75-488b-aced-66d1856bab9d
status: test
description: >
  An SSH brute force from a source address, then a successful login from the
  same address within thirty minutes: the guessed credentials probably worked.
author: sabitova
date: 2026-10-22
tags:
  - attack.credential-access
  - attack.t1110.001
  - attack.initial-access
