[project]
name = "nyctala"
version = "0.0.1"
description = "Lightweight detection-engineering SIEM: Sigma rules as code, tested rules, explainable alerts and measured ATT&CK coverage."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sabitova" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0",
    "pyarrow>=26.0",
    "pydantic>=2.14",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.urls]
Repository = "https://github.com/KristinaSabitova/nyctala"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["nyctala", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
