#!/usr/sbin/nft -f
# Host firewall for the nyctala VPS: deny by default.
#
#   SSH        only from the admin address(es)
#   WireGuard  UDP from the sensors' public addresses (or anywhere: WireGuard
#              does not answer unauthenticated packets)
#   ingest     TCP 8514 only through the WireGuard interface
#
# Uses its own table instead of `flush ruleset`, so reloading it does not wipe
# the rules Docker installs. Placeholders are filled in by bootstrap.sh.

table inet nyctala
delete table inet nyctala

table inet nyctala {
    set admin_v4 { type ipv4_addr; flags interval; elements = { __ADMIN_V4__ } }
    set sensors_v4 { type ipv4_addr; flags interval; elements = { __SENSORS_V4__ } }

    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state invalid drop
        ct state established,related accept

        # ICMP needed for path MTU discovery and diagnostics, rate limited.
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } limit rate 10/second accept

        tcp dport 22 ip saddr @admin_v4 ct state new limit rate 10/minute accept
        udp dport __WG_PORT__ ip saddr @sensors_v4 accept
        iifname "wg0" tcp dport 8514 accept

        log prefix "nyctala-drop " level info limit rate 5/minute
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
