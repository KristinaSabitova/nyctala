name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run nyctala rules test
      - run: uv run nyctala lab run
      - run: uv build

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x deploy/deploy.sh deploy/hardening/*.sh deploy/offsite/*.sh deploy/sensor/*.sh
      - name: compose config
        run: cd deploy && docker compose config --quiet
      - name: build image
        run: docker build -f deploy/Dockerfile -t nyctala:ci .
      - name: image runs unprivileged and offline-capable
        run: |
          test "$(docker run --rm --entrypoint id nyctala:ci -u)" = "10001"
          docker run --rm --network none --read-only nyctala:ci rules test
          docker run --rm --network none --read-only --tmpfs /tmp nyctala:ci lab run
